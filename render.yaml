# Render Blueprint: one persistent service for API, frontend, SQLite and uploads.
# Deployment is started by the repository owner in Render; saving this file
# neither creates a service nor incurs charges. A paid plan is required for disk.
services:
  - type: web
    name: baihuali-assessment
    runtime: python
    plan: starter
    region: singapore
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: baihuali-data
      mountPath: /var/data/baihuali
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: NODE_VERSION
        value: "22"
      - key: BAIHUALI_DATA_DIR
        value: /var/data/baihuali
      - key: COOKIE_SECURE
        value: "1"
      - key: BAIHUALI_REQUIRE_SETUP_KEY
        value: "1"
      - key: BAIHUALI_SETUP_KEY
        generateValue: true
